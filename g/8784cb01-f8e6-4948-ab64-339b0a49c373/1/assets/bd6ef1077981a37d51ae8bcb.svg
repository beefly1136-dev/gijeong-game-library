<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="100%" height="100%">
  <defs>
    <linearGradient id="judgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="deskWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <filter id="goldShine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Wooden Examination Stand Base -->
  <rect x="15" y="190" width="250" height="35" rx="6" fill="url(#deskWood)" stroke="#4338ca" stroke-width="2"/>
  <rect x="25" y="200" width="230" height="15" rx="3" fill="#0f172a"/>

  <!-- Golden Scales of Justice (Central Feature) -->
  <g transform="translate(140, 30)">
    <!-- Base Plate -->
    <rect x="-35" y="155" width="70" height="12" rx="4" fill="url(#judgeGold)" stroke="#78350f" stroke-width="1.5"/>
    <circle cx="0" cy="155" r="14" fill="url(#judgeGold)"/>
    <!-- Vertical Pillar -->
    <line x1="0" y1="20" x2="0" y2="155" stroke="url(#judgeGold)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="18" r="8" fill="#fde047" filter="url(#goldShine)"/>

    <!-- Balance Crossbeam -->
    <line x1="-80" y1="40" x2="80" y2="40" stroke="url(#judgeGold)" stroke-width="5" stroke-linecap="round"/>
    <!-- Center Pivot Ring -->
    <circle cx="0" cy="40" r="10" fill="#0f172a" stroke="url(#judgeGold)" stroke-width="3"/>

    <!-- Left Pan (Invention / Claims) -->
    <line x1="-80" y1="40" x2="-100" y2="95" stroke="#fef08a" stroke-width="2"/>
    <line x1="-80" y1="40" x2="-60" y2="95" stroke="#fef08a" stroke-width="2"/>
    <path d="M -110 95 Q -80 115 -50 95 Z" fill="url(#judgeGold)" stroke="#78350f" stroke-width="1.5"/>

    <!-- Right Pan (Prior Art / Rights) -->
    <line x1="80" y1="40" x2="60" y2="95" stroke="#fef08a" stroke-width="2"/>
    <line x1="80" y1="40" x2="100" y2="95" stroke="#fef08a" stroke-width="2"/>
    <path d="M 50 95 Q 80 115 110 95 Z" fill="url(#judgeGold)" stroke="#78350f" stroke-width="1.5"/>
  </g>

  <!-- Legal Examiner's Gavel (판결봉) Resting on Base -->
  <g transform="translate(45, 170) rotate(-15)">
    <rect x="0" y="0" width="14" height="28" rx="3" fill="#78350f" stroke="#b45309" stroke-width="1.5"/>
    <rect x="-10" y="9" width="34" height="10" rx="2" fill="#92400e" stroke="#f59e0b" stroke-width="1"/>
    <line x1="7" y1="28" x2="7" y2="65" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Official Red Approval Stamp (승인 인장) -->
  <g transform="translate(200, 160)">
    <rect x="0" y="0" width="28" height="24" rx="4" fill="#991b1b" stroke="#fca5a5" stroke-width="1.5"/>
    <circle cx="14" cy="12" r="8" fill="#b91c1c"/>
    <text x="14" y="16" font-size="8" font-family="Pretendard, sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle">인</text>
  </g>

  <!-- Badge Label -->
  <rect x="65" y="198" width="150" height="20" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="140" y="212" font-size="10" font-family="Pretendard, sans-serif" font-weight="bold" fill="#fbbf24" text-anchor="middle">
    지식재산 5대 권리 심사대
  </text>
</svg>
