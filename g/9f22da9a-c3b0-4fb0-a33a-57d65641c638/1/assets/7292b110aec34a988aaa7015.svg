<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <defs>
    <linearGradient id="pCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="pGlow">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="700" height="240" rx="16" fill="#080e1a" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Top Title -->
  <rect x="200" y="12" width="300" height="28" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="#00f0ff" stroke-width="1.2" />
  <text x="350" y="31" fill="#00f0ff" font-family="'Orbitron', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    PRODUCT DEVELOPMENT : 5 STEPS
  </text>

  <!-- Step 1: 기획 -->
  <g transform="translate(20, 60)">
    <rect width="115" height="150" rx="12" fill="url(#pCardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="57" cy="35" r="20" fill="#0284c7" />
    <text x="57" y="42" fill="#fff" font-size="20" text-anchor="middle">💡</text>
    <text x="57" y="78" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. 기획</text>
    <text x="57" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">요구 분석</text>
    <text x="57" y="118" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">아이디어 구상</text>
    <rect x="15" y="130" width="85" height="14" rx="4" fill="#0369a1" />
    <text x="57" y="140" fill="#e0f2fe" font-size="9" text-anchor="middle">타워 스펙 결정</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M143,135 L153,135" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />
  <text x="148" y="139" fill="#00f0ff" font-size="14" font-weight="bold" text-anchor="middle">▶</text>

  <!-- Step 2: 설계 -->
  <g transform="translate(156, 60)">
    <rect width="115" height="150" rx="12" fill="url(#pCardGrad)" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="57" cy="35" r="20" fill="#0891b2" />
    <text x="57" y="42" fill="#fff" font-size="20" text-anchor="middle">📐</text>
    <text x="57" y="78" fill="#00f0ff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. 설계</text>
    <text x="57" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">도면 작성</text>
    <text x="57" y="118" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">재료/척도 선정</text>
    <rect x="15" y="130" width="85" height="14" rx="4" fill="#0e7490" />
    <text x="57" y="140" fill="#cffafe" font-size="9" text-anchor="middle">CAD 도면 복원</text>
  </g>

  <!-- Arrow 2 -->
  <text x="284" y="139" fill="#00f0ff" font-size="14" font-weight="bold" text-anchor="middle">▶</text>

  <!-- Step 3: 시제품 -->
  <g transform="translate(292, 60)">
    <rect width="115" height="150" rx="12" fill="url(#pCardGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="57" cy="35" r="20" fill="#d97706" />
    <text x="57" y="42" fill="#fff" font-size="20" text-anchor="middle">🧪</text>
    <text x="57" y="78" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. 시제품</text>
    <text x="57" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">프로토타입 제작</text>
    <text x="57" y="118" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">문제점 보완</text>
    <rect x="15" y="130" width="85" height="14" rx="4" fill="#b45309" />
    <text x="57" y="140" fill="#fef3c7" font-size="9" text-anchor="middle">단열/정화 테스트</text>
  </g>

  <!-- Arrow 3 -->
  <text x="420" y="139" fill="#f59e0b" font-size="14" font-weight="bold" text-anchor="middle">▶</text>

  <!-- Step 4: 생산 -->
  <g transform="translate(428, 60)">
    <rect width="115" height="150" rx="12" fill="url(#pCardGrad)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="57" cy="35" r="20" fill="#059669" />
    <text x="57" y="42" fill="#fff" font-size="20" text-anchor="middle">⚙️</text>
    <text x="57" y="78" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">4. 생산</text>
    <text x="57" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">안전 수칙 준수</text>
    <text x="57" y="118" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">양산 및 조립</text>
    <rect x="15" y="130" width="85" height="14" rx="4" fill="#047857" />
    <text x="57" y="140" fill="#d1fae5" font-size="9" text-anchor="middle">타워 메인 프레임</text>
  </g>

  <!-- Arrow 4 -->
  <text x="556" y="139" fill="#10b981" font-size="14" font-weight="bold" text-anchor="middle">▶</text>

  <!-- Step 5: 출시 -->
  <g transform="translate(564, 60)">
    <rect width="115" height="150" rx="12" fill="url(#pCardGrad)" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="57" cy="35" r="20" fill="#7e22ce" />
    <text x="57" y="42" fill="#fff" font-size="20" text-anchor="middle">🚀</text>
    <text x="57" y="78" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">5. 출시</text>
    <text x="57" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">배포 및 가동</text>
    <text x="57" y="118" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">사후 평가/피드백</text>
    <rect x="15" y="130" width="85" height="14" rx="4" fill="#6b21a8" />
    <text x="57" y="140" fill="#f3e8ff" font-size="9" text-anchor="middle">도시 공기 정화</text>
  </g>
</svg>
