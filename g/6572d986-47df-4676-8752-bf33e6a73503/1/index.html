<!doctype html><html lang="ko"><head><base href="https://six-villages.web.app/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여섯 마을의 선택</title><link rel="icon" href="img/logo.jpg">
<style>
:root{--bg:#0b1020;--ink:#eef2ff;--muted:#9aa6c4;--gold:#ffcf5a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 600px at 15% -10%,#24306b,transparent 60%),radial-gradient(800px 500px at 110% 110%,#3b1f5c,transparent 55%),var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;padding:16px}
main{width:min(760px,100%);text-align:center}
h1{font-size:clamp(34px,7vw,64px);margin:6px 0 10px;background:linear-gradient(120deg,#fff,#ffe08a 45%,#9dc0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--muted);margin:0 0 28px}.k{color:var(--gold);font-weight:800;letter-spacing:.12em;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
a{display:block;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:22px;text-align:left;transition:.2s}
a:hover{transform:translateY(-3px);border-color:var(--gold)}a b{display:block;font-size:20px;margin-bottom:6px}a span{color:var(--muted);font-size:14px;line-height:1.5}
.lg{width:150px;height:150px;margin:0 auto 14px;border-radius:32px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.12)}.lg img{width:100%;height:100%;object-fit:cover;display:block}
</style><style>html,body{min-height:100dvh;margin:0;padding:0;box-sizing:border-box}main{width:100%;max-width:none;box-sizing:border-box}</style><style id="gc-fullscreen-only">
html.gc-fullscreen,html.gc-fullscreen body{width:100%;min-height:100%;min-height:100dvh;margin:0!important;padding:0!important;box-sizing:border-box}
html.gc-fullscreen #app,html.gc-fullscreen #root{width:100%;min-height:100dvh}
html.gc-fullscreen .wrapper,html.gc-fullscreen .dashboard,html.gc-fullscreen main{max-width:none}
html.gc-fullscreen .room-container{max-width:none;max-height:none}
html.gc-fullscreen .console-container{max-width:none;width:100%;min-height:100dvh;border-radius:0}
html.gc-fullscreen #game-app-viewport{height:100dvh}
html.gc-fullscreen #game-frame{width:100%;max-width:none;height:100dvh;min-height:0;border:0;border-radius:0}
html.gc-fullscreen #stage-viewport{min-height:0;padding-bottom:var(--gc-panel-space,240px)}
html.gc-fullscreen #avatar-img{max-height:min(410px,44dvh)}
html.gc-fullscreen #interaction-panel{max-height:55dvh;overflow-y:auto}
@media(max-width:900px){html.gc-fullscreen #game-frame{height:100dvh}html.gc-fullscreen #interaction-panel{bottom:8px;width:calc(100% - 16px);padding:12px}html.gc-fullscreen #top-nav{padding:8px;gap:8px;flex-wrap:wrap}}
</style></head><body><main>
<div class="lg"><img src="img/logo.jpg" alt="여섯 마을의 선택 로고" onerror="this.parentNode.remove()"></div><div class="k">적정기술 트레이드 게임</div><h1>여섯 마을의 선택</h1><p>좋은 기술이 아니라, 그 마을에 맞는 기술을.</p>

</main><script>(()=>{let embedded=false;const apply=()=>{document.documentElement.classList.toggle('gc-fullscreen',embedded||!!document.fullscreenElement);dispatchEvent(new Event('resize'))};addEventListener('message',e=>{if(e.source===parent&&e.origin==='https://game-center-site.beefly1136.workers.dev'&&e.data?.type==='game-center:fullscreen'){embedded=!!e.data.active;apply()}});document.addEventListener('fullscreenchange',apply);apply()})();</script></body></html>
