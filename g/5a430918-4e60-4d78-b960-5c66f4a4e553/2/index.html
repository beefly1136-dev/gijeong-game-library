<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>커뮤니케이션 타임머신</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic+Coding:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: a 16:9 stage that fills a laptop screen (1366×768) without scrolling; dialogue and mission cards float inside the stage;
   computer and phone scenes take over the whole window. Deliberately one dark "time-lab night" look for the game chrome. */
:root{
  --night:#121735; --panel:#1c2350; --panel-2:#263070; --ink:#eef1ff; --ink-dim:#aab2dd;
  --cyan:#5fd6e8; --amber:#ffb547; --good:#6fdc8c; --bad:#ff7a85; --line:rgba(160,175,255,.2);
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --retro:"Dotum","Gulim","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
:root{--vh:1vh;--vw:1vw}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:20px;line-height:1.55;overflow:hidden;box-sizing:border-box;-webkit-text-size-adjust:100%;overscroll-behavior:none}
/* 화면 크기에 맞춰 게임 전체를 같은 비율로 줄이거나(작은 화면) 그대로 두는(큰 화면) 바깥 틀 */
#fit{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden}
#rotmsg{position:fixed;inset:0;z-index:99999;background:#0e1233;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font-size:18px;line-height:1.5}
#rotmsg .ph{font-size:56px;animation:rotph 2.4s ease-in-out infinite}@keyframes rotph{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rotmsg button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:10px 16px;font-size:16px}
#rotmsg button.pri{background:#ffb547;color:#2a1700;border-color:#ffb547;font-weight:700}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:none}
.logo{font-family:var(--display);font-size:20.5px}.logo b{color:var(--cyan);font-weight:400}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:17px;color:var(--ink-dim)}
.chip.era{color:var(--amber);border-color:rgba(255,181,71,.35)}
.spacer{flex:1}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:17px;color:var(--ink-dim)}
.ghost:hover{color:var(--ink);border-color:var(--cyan)}
.stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:min(100%,calc((calc(100*var(--vh)) - 70px)*16/9));aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#000 center/cover no-repeat;box-shadow:0 18px 40px rgba(0,0,0,.45);container-type:inline-size}
.cast{position:absolute;inset:0}
.actor{position:absolute;bottom:-2%;height:88%;transform:translateX(-50%);transition:filter .3s,opacity .4s,transform .4s;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.actor.dim{filter:brightness(.6) drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.actor.enter{opacity:0;transform:translateX(-50%) translateY(14px)}
.stamp{position:absolute;left:12px;top:10px;z-index:3;font-family:var(--display);font-size:clamp(17px,1.9cqw,22px);padding:4px 14px;border-radius:999px;background:rgba(18,23,53,.75);border:1px solid var(--line)}
.title-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:6%;text-align:center;z-index:2}
.title-overlay h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,6.4cqw,70px);line-height:1.05;margin:0;color:#fff;text-shadow:0 3px 0 #3b2c8f,0 8px 26px rgba(40,20,120,.55)}
.title-overlay p{margin:.6em 0 0;font-size:clamp(14px,1.6cqw,17px);color:#fff;background:rgba(40,30,110,.55);padding:4px 14px;border-radius:999px}

/* dialogue + overlays inside the stage */
.dlg{position:absolute;left:3%;right:3%;bottom:3%;z-index:6;background:rgba(18,23,53,.92);border:1px solid var(--line);border-radius:14px;padding:12px 16px 10px;display:grid;gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.4);cursor:pointer}
.dlg .who{font-family:var(--display);font-size:clamp(20.5px,2cqw,24px);display:flex;align-items:center;gap:8px}
.dlg .who i{width:10px;height:10px;border-radius:3px}
.dlg .txt{font-size:clamp(20.5px,2.15cqw,26px);line-height:1.6;min-height:3.2em}
.dlg .more{justify-self:end;font-size:16px;color:var(--ink-dim)}
.ov{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;background:rgba(10,12,30,.45);padding:3%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 28px;max-width:min(900px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 16px 40px rgba(0,0,0,.5);animation:pop .3s ease both}
.card.wide{max-width:min(1120px,100%)}
.card.sitcard{max-width:min(1040px,100%);width:100%;padding:30px 36px;gap:18px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.kicker{font-size:16px;letter-spacing:.08em;color:var(--cyan);font-weight:700}
h2.pt{font-family:var(--display);font-weight:400;font-size:clamp(25.5px,2.6cqw,30px);margin:0;text-wrap:balance}
.muted{color:var(--ink-dim);font-size:18.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.btn{border:0;border-radius:10px;padding:10px 20px;font-size:20.5px;font-weight:700;background:var(--cyan);color:#0b1630}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.btn.amber{background:var(--amber);color:#2a1700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.choices{display:grid;gap:8px}
.choice{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 14px}
.choice:hover:not(:disabled){border-color:var(--cyan)}
.choice.right{border-color:var(--good);background:rgba(111,220,140,.14)}
.choice.wrong{border-color:var(--bad);background:rgba(255,122,133,.12)}
.fb{border-radius:10px;padding:9px 14px;font-size:19px;background:var(--panel-2);border-left:4px solid var(--cyan)}
.fb.bad{border-left-color:var(--bad)}.fb.good{border-left-color:var(--good)}
.hot{position:absolute;z-index:5;border:3px solid var(--amber);border-radius:12px;background:rgba(255,181,71,.12);animation:glow 1.1s infinite alternate;display:flex;align-items:flex-end;justify-content:center;padding:0}
.hot span{transform:translateY(130%);background:var(--amber);color:#2a1700;font-weight:700;font-size:clamp(16px,1.6cqw,19px);padding:4px 12px;border-radius:999px;white-space:nowrap}
@keyframes glow{to{box-shadow:0 0 0 8px rgba(255,181,71,.25)}}

/* situation card */
.sit{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:start}
.sit img{width:150px;height:150px;border-radius:18px;background:#fff}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:19.5px;margin:0}
.facts dt{color:var(--ink-dim)}.facts dd{margin:0;min-width:0}
.facts .msg{font-family:var(--display);font-size:clamp(27.5px,3cqw,34px);color:var(--amber);line-height:1.3}
.sitcard .facts{font-size:clamp(19.5px,2cqw,22px);gap:8px 20px}
.sitcard .kicker{font-size:18.5px}
.sitcard .btn{font-size:23px;padding:12px 28px}
/* setup (game-style registration) */
.card.setupcard{position:relative;width:100%;max-width:min(1240px,100%);height:100%;padding:clamp(16px,2.2cqw,30px) clamp(20px,2.8cqw,40px);gap:clamp(8px,1.2cqw,16px);
  background:linear-gradient(160deg,rgba(28,35,80,.97),rgba(20,24,60,.97)),repeating-linear-gradient(0deg,transparent 0 3px,rgba(95,214,232,.05) 3px 4px);
  border:2px solid rgba(95,214,232,.55);box-shadow:0 0 0 1px rgba(95,214,232,.2),0 0 40px rgba(95,214,232,.25),0 20px 60px rgba(0,0,0,.6);overflow:hidden}
.setupcard::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 0,rgba(95,214,232,.10) 50%,transparent 100%);height:30%;animation:scan 4s linear infinite;pointer-events:none}
@keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(420%)}}
.setupcard .cn{position:absolute;width:28px;height:28px;border:4px solid var(--amber)}
.setupcard .cn.tl{left:8px;top:8px;border-right:0;border-bottom:0}.setupcard .cn.tr{right:8px;top:8px;border-left:0;border-bottom:0}
.setupcard .cn.bl{left:8px;bottom:8px;border-right:0;border-top:0}.setupcard .cn.br{right:8px;bottom:8px;border-left:0;border-top:0}
.sethead{text-align:center;display:grid;gap:2px}
.sethead .pt{font-size:clamp(28px,3.2cqw,42px);color:#fff;text-shadow:0 0 18px rgba(95,214,232,.6)}
.sethead p{margin:0;color:var(--ink-dim);font-size:clamp(17px,1.6cqw,21px)}
.setgrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(14px,2cqw,28px);align-items:stretch}
.picks2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.4cqw,20px);min-height:0}
.pick2{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border-radius:18px;border:3px solid var(--line);
  background:radial-gradient(ellipse at 50% 85%,rgba(95,214,232,.25),transparent 60%),linear-gradient(#232b66,#161b45);padding:10px 8px 12px;overflow:hidden;min-height:0;transition:transform .2s,border-color .2s,box-shadow .2s}
.pick2:hover{transform:translateY(-4px);border-color:rgba(95,214,232,.7)}
.pick2 img{height:min(100%,calc(100% - 64px));max-height:clamp(220px,30cqw,420px);width:auto;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5));transition:transform .3s}
.pick2 .glow{position:absolute;left:50%;bottom:58px;width:70%;height:22px;border-radius:50%;transform:translateX(-50%);background:radial-gradient(rgba(95,214,232,.7),transparent 70%)}
.pick2 .plate{display:grid;justify-items:center;font-family:var(--display);font-size:clamp(20px,2cqw,26px);color:#fff;line-height:1.15;margin-top:6px}
.pick2 .plate small{font-family:var(--body);font-size:13px;letter-spacing:.15em;color:var(--cyan)}
.pick2 .check{position:absolute;top:10px;right:10px;background:var(--amber);color:#2a1700;font-weight:700;border-radius:999px;padding:2px 12px;font-size:15px;opacity:0;transform:scale(.6);transition:.2s}
.pick2[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,181,71,.35),0 0 30px rgba(255,181,71,.35)}
.pick2[aria-pressed="true"] img{transform:scale(1.05);animation:hop 1.4s ease-in-out infinite}
.pick2[aria-pressed="true"] .check{opacity:1;transform:none}
.pick2[aria-pressed="true"] .glow{background:radial-gradient(rgba(255,181,71,.8),transparent 70%)}
@keyframes hop{50%{transform:scale(1.05) translateY(-6px)}}
.idside>*{flex:none}
.idside{display:flex;flex-direction:column;gap:clamp(6px,.9cqw,12px);min-height:0;overflow:auto}
.idcard{border-radius:16px;background:linear-gradient(135deg,#fdfbff,#e6ecff);color:#1d2340;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:grid;gap:8px;position:relative;overflow:hidden}
.idcard::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 45%,transparent 60%);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{from{transform:translateX(-100%)}60%,to{transform:translateX(100%)}}
.idtop{display:flex;justify-content:space-between;font-weight:700;font-size:15px;color:#2b3480;letter-spacing:.05em}
.idtop .lv{background:#2b3480;color:#fff;border-radius:6px;padding:0 8px}
.idbody{display:grid;grid-template-columns:clamp(70px,8cqw,104px) 1fr;gap:12px;align-items:center}
.idph{height:clamp(84px,9.5cqw,124px);border-radius:10px;background:linear-gradient(#c9d6ff,#eef2ff);overflow:hidden;display:flex;justify-content:center}
.idph img{height:260%;width:auto;object-fit:cover;object-position:top}
.idinfo{display:grid;gap:2px;font-size:clamp(18px,1.8cqw,24px)}
.idinfo small{display:block;font-size:13px;color:#6a6f99}
.idinfo .idtype{font-family:var(--display);color:#d0791a;font-size:clamp(16px,1.5cqw,20px)}
.barcode{height:16px;background:repeating-linear-gradient(90deg,#1d2340 0 2px,transparent 2px 4px,#1d2340 4px 7px,transparent 7px 9px,#1d2340 9px 10px,transparent 10px 13px)}
.setupcard .field span{font-size:clamp(16px,1.5cqw,19px);color:var(--ink-dim)}
.setupcard .field input{font-size:clamp(20px,2cqw,26px);padding:8px 14px;border:2px solid rgba(95,214,232,.4);background:rgba(10,14,40,.8)}
.setupcard .gobtn{font-size:clamp(20px,2.1cqw,27px);padding:12px 20px;border-radius:14px;box-shadow:0 6px 0 #b8761e,0 0 24px rgba(255,181,71,.45);animation:gopulse 1.6s ease-in-out infinite}
.setupcard .gobtn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8761e}
@keyframes gopulse{50%{box-shadow:0 6px 0 #b8761e,0 0 40px rgba(255,181,71,.75)}}
.setupcard .err{font-size:17px;min-height:0}
.idfields{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.idfields input{width:100%;min-width:0}
@media (max-width:0px){.setgrid{grid-template-columns:1fr}.card.setupcard{height:auto}}

/* setup */
.picks{display:flex;gap:12px;flex-wrap:wrap}
.pick{display:flex;flex-direction:column;align-items:center;gap:6px;width:clamp(150px,16cqw,210px);padding:10px;font-size:22px;font-weight:700;border-radius:12px;border:2px solid var(--line);background:var(--panel-2)}
.pick img{height:clamp(170px,22cqw,270px);width:auto}
.pick[aria-pressed="true"]{border-color:var(--cyan);background:rgba(95,214,232,.14)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,260px));gap:14px}
.field{display:grid;gap:3px}
.field input,.field select,.field textarea{background:var(--night);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);font:inherit;font-size:23px}
.err{color:var(--bad);font-size:17px;min-height:1.2em}

/* map */
.map{display:grid;gap:8px}
.chap{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center}
.chap h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink-dim)}
.nodes{display:flex;gap:6px;flex-wrap:wrap}
.node{min-width:58px;padding:5px 8px;border-radius:9px;border:1px dashed var(--line);background:transparent;color:var(--ink-dim);font-size:17px;text-align:center;line-height:1.3}
.node.open{border:1px solid var(--cyan);background:rgba(95,214,232,.14);color:var(--ink)}
.node.done{border-color:var(--good);background:rgba(111,220,140,.14)}
.node[disabled]{cursor:default;opacity:.6}
.node .s{display:block;color:var(--amber);font-size:15px;letter-spacing:1px}

/* 1-3 */
.sig{display:grid;gap:4px;font-size:17px}
.sig div{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;background:var(--panel-2);border-radius:7px;padding:3px 8px}
.flames{display:flex;gap:1px}.flames span{font-size:15px;line-height:1;opacity:.22;filter:grayscale(1)}
.flames span.on{opacity:1;filter:none}
.two{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:start}
.chimneys{display:flex;gap:clamp(8px,1.6cqw,16px);justify-content:center;align-items:flex-end;padding:78px 0 6px}
.chim{width:clamp(58px,8cqw,92px);height:clamp(64px,9cqw,100px);border:0;padding:0;background:url(assets/bongsu_tower.webp?v=16) center bottom/contain no-repeat;position:relative;cursor:pointer;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));transition:transform .15s}
.chim:hover{transform:translateY(-2px)}
.chim::before,.chim::after{position:absolute;left:50%;line-height:1;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s}
.chim::before{content:"🔥";top:-.78em;font-size:clamp(30px,3.8cqw,44px);transform:translateX(-50%) scale(.3);transform-origin:50% 100%}
.chim.smoke::after{content:"💨";top:-2.1em;font-size:clamp(24px,3cqw,34px);transform:translateX(-50%) rotate(-90deg) scale(.3)}
.chim.on::before{opacity:1;transform:translateX(-50%) scale(1);animation:emflame .55s infinite alternate}
.chim.on::after{opacity:.95;transform:translateX(-50%) rotate(-90deg) scale(1);animation:emsmoke 1.4s infinite ease-in-out}
@keyframes emflame{from{transform:translateX(-50%) scale(1) rotate(-4deg)}to{transform:translateX(-50%) scale(1.12,1.18) rotate(4deg)}}
@keyframes emsmoke{0%{transform:translateX(-50%) translateY(6px) rotate(-90deg);opacity:.5}50%{opacity:1}100%{transform:translateX(-50%) translateY(-6px) rotate(-90deg);opacity:.6}}
.chim small{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:15px;font-weight:800;color:#fff;background:rgba(40,25,10,.75);border-radius:999px;padding:0 8px}
@keyframes flick{to{transform:translateX(-50%) scale(1.08,.92)}}
.route svg{display:block;width:100%;height:auto}
.tower{cursor:pointer}
.tower circle.base{fill:#3a4278;stroke:#7f8ad0;stroke-width:2}
.tower.lit circle.base{fill:#ffb547;stroke:#fff3b0}
.tower.next circle.base{stroke:var(--cyan);stroke-width:3;animation:pulse 1s infinite alternate}
.tower text{fill:var(--ink);font-size:16px;font-family:var(--body);text-anchor:middle}
@keyframes pulse{to{stroke-width:6}}
.clock{font-variant-numeric:tabular-nums;font-family:var(--display);font-size:20.5px;color:var(--amber)}

/* results */
.result{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:16px;align-items:start}
.stars{font-size:32px;letter-spacing:4px;color:var(--amber)}.stars .off{color:#3a4278}
.radar text{fill:var(--ink-dim);font-size:16px;font-family:var(--body)}
.mcard{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--panel-2);border-radius:12px;padding:10px}
.mcard img{width:64px;height:64px;border-radius:10px;background:#fff}
.mcard ul{margin:4px 0 0;padding-left:18px;font-size:17px}
.legend{display:flex;gap:14px;font-size:16px;color:var(--ink-dim)}
.legend i{display:inline-block;width:12px;height:3px;margin-right:5px;vertical-align:middle}

/* ===== full-window device layer ===== */
.device{position:fixed;inset:0;z-index:50;background:#000;color-scheme:light;animation:zoomIn .45s ease both}
@keyframes zoomIn{from{opacity:0;transform:scale(.6)}}
.boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#cfd8ff;font-family:var(--retro);background:#000}
.boot .bar2{width:220px;height:14px;border:2px solid #6a7bd0;padding:2px}
.boot .bar2 i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#4d74e0 0 14px,transparent 14px 18px);animation:load 1.6s linear forwards}
@keyframes load{to{width:100%}}
/* retro desktop (generic early-2000s OS) */
.desk{position:absolute;inset:0;font-family:var(--retro);font-size:17px;color:#14203a;overflow:hidden;
  background:#3a7bd5 url(assets/desk_wall.jpg) center/cover no-repeat}
.desk.d90{background:#1d7a78}
.icons{position:absolute;left:14px;top:14px;display:grid;gap:14px;grid-auto-flow:column;grid-template-rows:repeat(5,auto);justify-content:start}
.dicon{width:96px;display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:1px dashed transparent;color:#fff;text-shadow:0 1px 2px #000;padding:4px;border-radius:3px;font-size:17px;text-align:center;font-family:var(--retro)}
.dicon:focus-visible,.dicon.sel{background:rgba(40,80,200,.45);border-color:#9fc0ff;outline:none}

/* 배경음악은 하나의 오디오 요소를 계속 씁니다(휴대폰에서도 처음 한 번 허용되면 계속 재생). 구매한 곡은 컴퓨터 스테이지가 끝날 때까지 이어집니다. */
let bgmEl=null,bgmKey=null,bgmWant=null,pvEl=null,pvKey=null,pvTimer=null,pvDone=null;
function bgmGet(){if(!bgmEl){bgmEl=new Audio();bgmEl.preload='auto';bgmEl.loop=true;bgmEl.addEventListener('error',()=>{try{toast('배경음악','음악 파일을 불러오지 못했어요. 인터넷 연결을 확인해 보세요.','bad')}catch(e){}})}return bgmEl}
function playTune(key){stopPreview(true);if(!TUNES[key])return;bgmWant=key;if(!soundOn)return;const a=bgmGet(),u=A+TUNES[key].f;if(bgmKey===key&&!a.paused)return;if(a.getAttribute('src')!==u)a.src=u;a.loop=true;a.volume=.45;bgmKey=key;try{const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{bgmKey=null})}catch(e){bgmKey=null}}
function stopTune(){if(bgmEl){try{bgmEl.pause()}catch(e){}}bgmKey=null}
function endTune(){stopPreview(true);stopTune();bgmWant=null}
/* 구매 전 미리듣기(처음 20초). 끝나면 내 BGM이 있으면 다시 이어서 틀어요. */
function previewTune(key){const was=pvKey===key;stopPreview(was?false:true);if(was||!TUNES[key]||!soundOn)return false;if(bgmEl&&!bgmEl.paused)bgmEl.pause();bgmKey=null;pvEl=pvEl||new Audio();pvEl.src=A+TUNES[key].f;pvEl.loop=false;pvEl.volume=.55;pvKey=key;try{const pr=pvEl.play();if(pr&&pr.catch)pr.catch(()=>stopPreview())}catch(e){stopPreview()}clearTimeout(pvTimer);pvTimer=setTimeout(()=>stopPreview(),20000);pvEl.onended=()=>stopPreview();return true}
function stopPreview(nr){if(pvKey===null)return;clearTimeout(pvTimer);pvKey=null;if(pvEl){try{pvEl.pause()}catch(e){}pvEl.onended=null}if(!nr&&bgmWant&&soundOn&&D){const a=bgmGet();bgmKey=bgmWant;try{const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}}if(pvDone)pvDone()}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// 선택지(.choices) 순서를 매번 무작위로 섞기 (정답이 늘 첫 번째가 되지 않도록)
const shufObs=new MutationObserver(recs=>{const set=new Set();
  for(const r of recs){if(r.target.nodeType===1&&r.target.classList.contains('choices'))set.add(r.target);
    r.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.classList.contains('choices'))set.add(n);n.querySelectorAll&&n.querySelectorAll('.choices').forEach(c=>set.add(c))})}
  set.forEach(c=>{if(c.hasAttribute('data-noshuf'))return;const kids=[...c.children].filter(k=>k.classList.contains('choice'));if(kids.length<2)return;
    const sig=kids.map(k=>k.textContent).sort().join('|');if(c.__sig===sig)return;
    let ord;do{ord=shuffle(kids.slice())}while(ord.every((k,i)=>k===kids[i]));c.append(...ord);c.__sig=sig});
  shufObs.takeRecords()});
shufObs.observe(document.body,{childList:true,subtree:true});
// 미션에 필요한 때에만 글을 쓸 수 있게 잠그기
const GATED=new Set();let gateT=0;
function gate(el,ok,why='지금은 이 칸에 글을 쓸 차례가 아니에요. 미션 메모의 굵은 글씨를 확인하세요.'){
  const ph=el.getAttribute('placeholder')||'';
  const chk=()=>{const lock=!ok();if(el.readOnly!==lock){el.readOnly=lock;el.classList.toggle('locked',lock);el.setAttribute('placeholder',lock?'🔒 지금은 쓰지 않아요':ph)}return lock};
  const warn=e=>{if(!chk())return;if(e.type==='keydown'&&['Tab','Escape'].includes(e.key))return;if(Date.now()-gateT>2000){gateT=Date.now();beep('bad');const r=el.getBoundingClientRect();const tip=h('div',{class:'gatetip',role:'status',style:`left:${Math.max(8,Math.min(innerWidth-340,r.left))}px;top:${r.top>70?r.top-62:r.bottom+8}px`},'🔒 '+why);document.body.append(tip);setTimeout(()=>tip.remove(),2600)}};
  ['focus','pointerdown','keydown'].forEach(t=>el.addEventListener(t,warn));el.__chk=chk;GATED.add(el);chk();return el}
setInterval(()=>GATED.forEach(el=>{if(!el.isConnected)GATED.delete(el);else el.__chk()}),600);
function setScene({bg,stamp,era,cast=[],speaker=null}={}){
  const st=$('#stage');if(bg)st.style.backgroundImage=`url(${verU(A+bg)})`;
  $('#stamp').hidden=!stamp;if(stamp)$('#stamp').textContent=stamp;
  $('#eraChip').hidden=!era;if(era)$('#eraChip').textContent=era;
  drawCast(cast,speaker);
}
function drawCast(cast,speaker){
  lastCast=cast;const box=$('#cast');const key=JSON.stringify(cast)+S.gender;
  if(key!==castKey){castKey=key;box.innerHTML='';cast.forEach(c=>{const img=h('img',{class:'actor enter',src:av(c.id,c.era),alt:c.id==='player'?pname():NAMES[c.id],style:`left:${c.x}%`,'data-who':c.id});box.append(img);requestAnimationFrame(()=>requestAnimationFrame(()=>img.classList.remove('enter')))})}
  box.querySelectorAll('.actor').forEach(a=>a.classList.toggle('dim',!!speaker&&a.dataset.who!==speaker));
}
function say(who,text){
  return new Promise(res=>{
    drawCast(lastCast,who);
    const txt=h('div',{class:'txt'});const name=who==='player'?pname():NAMES[who];
    const box=h('div',{class:'dlg',role:'button',tabindex:'0','aria-label':'다음 대사'},h('div',{class:'who'},h('i',{style:`background:${COLORS[who]}`}),name),txt,h('span',{class:'more'},'클릭하거나 Enter ▶'));
    layer().replaceChildren(box);box.focus({preventScroll:true});
    let i=0,done=false,t;const fin=()=>{clearInterval(t);txt.textContent=text;done=true};
    if(REDUCE)fin();else t=setInterval(()=>{txt.textContent=text.slice(0,++i);if(i>=text.length)fin()},22);
    const next=()=>{if(!done)return fin();layer().replaceChildren();drawCast(lastCast,null);res()};
    box.onclick=next;box.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();next()}};
  });
}
function overlay(card){const o=h('div',{class:'ov'},card);layer().replaceChildren(o);return o}
function hotspot(rect,label,icon){return new Promise(res=>{const b=h('button',{class:'hot',type:'button',style:`left:${rect[0]}%;top:${rect[1]}%;width:${rect[2]}%;height:${rect[3]}%`,'aria-label':label,onclick:()=>{layer().replaceChildren();res()}},icon?h('b',{style:'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(32px,5cqw,60px);animation:flick .25s infinite alternate'},icon):null,h('span',{},label));layer().replaceChildren(b);b.focus({preventScroll:true})})}

    let slow=setTimeout(()=>{load.textContent='새 시대의 풍경을 불러오는 중…'},400);await ready;clearTimeout(slow);
    res();requestAnimationFrame(()=>requestAnimationFrame(()=>{w.classList.add('wout');setTimeout(()=>w.remove(),480)}))};
  const w=h('div',{class:'warp',role:'status','aria-label':`${toY}(으)로 이동 중`,onclick:done},

    h('div',{class:'wpanel'},h('span',{class:'kicker'},'TIME MACHINE · 시간 이동 중'),yr,h('div',{class:'wto'},`▶ ${o.title||STAGES[to].title}`),h('small',{},'클릭하면 바로 도착'),load));

  const bw=(cw-32)/3;[['학번',S.sid],['이름',S.name],['날짜',ds]].forEach(([k,v],i)=>{const bx=P+i*(bw+16);x.fillStyle='#f1f2fb';rr(bx,y,bw,info,16);x.fill();x.fillStyle='#6a6f99';x.font=F(22,600);x.fillText(k,bx+24,y+40);x.fillStyle='#1d2340';x.font=F(36,800);x.fillText(v,bx+24,y+88)});
  y+=info+22;
  const doneN=ids.filter(i=>(S.results[i]||{}).done).length,three=ids.filter(i=>((S.results[i]||{}).stars||0)>=3).length;
  [['여행한 시대',`${doneN} / ${ids.length}`],['모은 별',`★ ${totalStars} / ${ids.length*3}`],['별 3개 시대',`${three}개`]].forEach(([k,v],i)=>{const bx=P+i*(bw+16);x.fillStyle='#fff7e0';rr(bx,y,bw,stats,16);x.fill();x.strokeStyle='#f3d999';x.lineWidth=2;x.stroke();x.fillStyle='#8a6a10';x.font=F(21,600);x.fillText(k,bx+24,y+36);x.fillStyle='#5a3d00';x.font=F(34,800);x.fillText(v,bx+24,y+78)});
  y+=stats+56;
  sec('시간 여행 기록',y);y+=24;
  rows.forEach(([ch,list])=>{const[n,...nm]=ch.split(' ');x.fillStyle='#f4f5fc';rr(P,y,cw,rowH,18);x.fill();
    x.fillStyle='#7a80aa';x.font=F(20,700);x.fillText(`${n}장`,P+20,y+rowH/2-8);x.fillStyle='#2b3480';x.font=F(24,800);(()=>{const out=[];let line='';for(const wd of nm){const t=line?line+' '+wd:wd;if(x.measureText(t).width>chW-24&&line){out.push(line);line=wd}else line=t}out.push(line);return out})().forEach((l,k)=>x.fillText(l,P+20,y+rowH/2+24+k*28));
    list.forEach((i,k)=>{const tx=P+chW+k*(tW+gap),ty=y+10;const r=S.results[i]||{};const st=r.stars||0;
      x.fillStyle='#ffffff';rr(tx,ty,tW,tH,14);x.fill();x.strokeStyle='#dfe2f3';x.lineWidth=2;x.stroke();
      x.globalAlpha=r.done?1:.35;if(icons[i])x.drawImage(icons[i],tx+tW/2-28,ty+10,56,56);
      x.textAlign='center';x.fillStyle='#1d2340';x.font=F(LABEL[i].length>5?17:20,700);x.fillText(LABEL[i],tx+tW/2,ty+90);
      x.font=F(20,700);const sw=x.measureText('★★★').width;let sx=tx+tW/2-sw/2;x.textAlign='left';for(let q=0;q<3;q++){x.fillStyle=q<st?'#f0a400':'#d4d7ea';x.fillText('★',sx,ty+116);sx+=sw/3}
      x.globalAlpha=1});
    y+=rowH+10});
  y+=40;sec('나의 생각 쓰기',y);y+=26;
  lay.forEach((b,k)=>{x.fillStyle='#5a43b0';x.beginPath();x.arc(P+18,y+18,18,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.font=F(22,800);x.textAlign='center';x.fillText(String(k+1),P+18,y+26);x.textAlign='left';
    x.fillStyle='#2b3480';x.font=F(28,800);x.fillText(b.t,P+48,y+28);y+=48;
    const bh=b.lines.length*LH+40;x.fillStyle='#ffffff';rr(P,y,cw,bh,16);x.fill();x.strokeStyle='#c9cce4';x.lineWidth=2;x.stroke();
    x.strokeStyle='#eef0f8';x.lineWidth=1.5;for(let q=1;q<b.lines.length;q++){x.beginPath();x.moveTo(P+24,y+20+q*LH+8);x.lineTo(P+cw-24,y+20+q*LH+8);x.stroke()}
    x.fillStyle='#1d2340';x.font=BF;b.lines.forEach((l,q)=>x.fillText(l,P+28,y+20+q*LH+32));y+=bh+36});
  x.fillStyle='#9aa0c8';x.font=F(20);x.fillText('이 보고서는 게임 속 활동 기록과 학생이 직접 쓴 내용으로 만들어졌어요.',P,H-44);
  x.textAlign='right';x.fillText('커뮤니케이션 타임머신',W-P,H-44);x.textAlign='left';
  return c;
  function sec(t,yy){x.fillStyle='#5a43b0';rr(P,yy-26,8,32,4);x.fill();x.fillStyle='#2b3480';x.font=F(32,800);x.fillText(t,P+20,yy)}
  function rr(a,b,w,h2,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h2,r);x.arcTo(a+w,b+h2,a,b+h2,r);x.arcTo(a,b+h2,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
}
