<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glowArch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="none"/>
  <circle cx="256" cy="256" r="230" fill="url(#glowArch)"/>
  
  <!-- Outer Hexagonal Barrier -->
  <polygon points="256,40 430,135 430,377 256,472 82,377 82,135" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="14,8"/>
  <polygon points="256,70 404,152 404,360 256,442 108,360 108,152" fill="rgba(56,189,248,0.12)" stroke="#7dd3fc" stroke-width="3"/>
  
  <!-- Blueprint Construction Grid Lines -->
  <line x1="82" y1="256" x2="430" y2="256" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="256" y1="40" x2="256" y2="472" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="108" y1="152" x2="404" y2="360" stroke="#34d399" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6,4"/>
  <line x1="108" y1="360" x2="404" y2="152" stroke="#34d399" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6,4"/>

  <!-- Center 3D Isometric Holographic Cube -->
  <!-- Top Face -->
  <polygon points="256,160 336,206 256,252 176,206" fill="#38bdf8" fill-opacity="0.75" stroke="#ffffff" stroke-width="3"/>
  <!-- Left Face -->
  <polygon points="176,206 256,252 256,344 176,298" fill="#0284c7" fill-opacity="0.85" stroke="#ffffff" stroke-width="3"/>
  <!-- Right Face -->
  <polygon points="256,252 336,206 336,298 256,344" fill="#0369a1" fill-opacity="0.9" stroke="#ffffff" stroke-width="3"/>

  <!-- Glowing Corner Nodes -->
  <circle cx="256" cy="160" r="8" fill="#ffffff"/>
  <circle cx="336" cy="206" r="8" fill="#ffffff"/>
  <circle cx="176" cy="206" r="8" fill="#ffffff"/>
  <circle cx="256" cy="252" r="10" fill="#fde047"/>
  <circle cx="176" cy="298" r="8" fill="#ffffff"/>
  <circle cx="336" cy="298" r="8" fill="#ffffff"/>
  <circle cx="256" cy="344" r="8" fill="#ffffff"/>

  <!-- Floating Construction Truss Sparks -->
  <circle cx="150" cy="110" r="4" fill="#34d399"/>
  <circle cx="360" cy="120" r="5" fill="#38bdf8"/>
  <circle cx="410" cy="260" r="4" fill="#67e8f9"/>
  <circle cx="110" cy="310" r="5" fill="#34d399"/>
  <circle cx="256" cy="420" r="6" fill="#fde047"/>
</svg>