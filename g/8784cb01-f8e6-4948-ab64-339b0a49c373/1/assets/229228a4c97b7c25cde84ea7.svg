<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="fabricGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="gasketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base Box -->
  <rect x="10" y="10" width="380" height="380" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Technical Grid Pattern -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1">
    <line x1="50" y1="10" x2="50" y2="390"/>
    <line x1="100" y1="10" x2="100" y2="390"/>
    <line x1="150" y1="10" x2="150" y2="390"/>
    <line x1="200" y1="10" x2="200" y2="390"/>
    <line x1="250" y1="10" x2="250" y2="390"/>
    <line x1="300" y1="10" x2="300" y2="390"/>
    <line x1="350" y1="10" x2="350" y2="390"/>
    <line x1="10" y1="50" x2="390" y2="50"/>
    <line x1="10" y1="100" x2="390" y2="100"/>
    <line x1="10" y1="150" x2="390" y2="150"/>
    <line x1="10" y1="200" x2="390" y2="200"/>
    <line x1="10" y1="250" x2="390" y2="250"/>
    <line x1="10" y1="300" x2="390" y2="300"/>
    <line x1="10" y1="350" x2="390" y2="350"/>
  </g>

  <!-- Title Badge -->
  <rect x="25" y="24" width="350" height="30" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="200" y="44" font-family="'Pretendard', sans-serif" font-size="12" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
    친환경 빗물 압착 스마트 우산 시제품 (Working Prototype)
  </text>

  <!-- ==================== UMBRELLA BODY ==================== -->
  <!-- Central Shaft / Rib (Stainless Steel) -->
  <line x1="200" y1="80" x2="200" y2="330" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <line x1="198" y1="80" x2="198" y2="330" stroke="#f8fafc" stroke-width="2"/>

  <!-- Canopy Ribs and Folded Umbrella Fabric -->
  <path d="M 120 220 C 140 140 180 90 200 85 C 220 90 260 140 280 220 C 250 215 220 225 200 220 C 180 225 150 215 120 220 Z" 
        fill="url(#fabricGrad)" stroke="#38bdf8" stroke-width="2"/>
  <!-- Fabric Fold Rib Lines -->
  <line x1="200" y1="85" x2="155" y2="218" stroke="#0284c7" stroke-width="1.8"/>
  <line x1="200" y1="85" x2="245" y2="218" stroke="#0284c7" stroke-width="1.8"/>
  <line x1="200" y1="85" x2="200" y2="220" stroke="#075985" stroke-width="2"/>

  <!-- ==================== PART 1: SLIDING GASKET RING ==================== -->
  <g transform="translate(200, 180)">
    <ellipse cx="0" cy="0" rx="60" ry="16" fill="url(#gasketGrad)" stroke="#fef08a" stroke-width="2.5" filter="url(#neonGlow)"/>
    <ellipse cx="0" cy="0" rx="42" ry="10" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
    <!-- Water Drops Wiped Off -->
    <circle cx="-50" cy="14" r="3.5" fill="#38bdf8" opacity="0.9"/>
    <circle cx="48" cy="12" r="3" fill="#38bdf8" opacity="0.9"/>
    <path d="M -30 18 Q -32 26 -28 26 Q -24 26 -26 18 Z" fill="#38bdf8"/>
    <path d="M 32 16 Q 30 24 34 24 Q 38 24 36 16 Z" fill="#38bdf8"/>
  </g>
  <!-- Callout Tag 1 -->
  <line x1="260" y1="180" x2="320" y2="180" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3"/>
  <rect x="270" y="152" width="115" height="24" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="327" y="168" font-family="'Pretendard', sans-serif" font-size="9.5" font-weight="bold" fill="#fbbf24" text-anchor="middle">
    ① 탄성 압착 가스켓
  </text>

  <!-- ==================== PART 3: TOP TIP MAGNETIC CUP ==================== -->
  <g transform="translate(200, 75)">
    <path d="M -14 10 L 14 10 L 10 -15 L -10 -15 Z" fill="url(#cupGrad)" stroke="#a5b4fc" stroke-width="2" filter="url(#neonGlow)"/>
    <!-- Magnetic Ring Collar -->
    <rect x="-12" y="5" width="24" height="6" rx="2" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
    <circle cx="0" cy="-15" r="4" fill="#cbd5e1"/>
  </g>
  <!-- Callout Tag 3 -->
  <line x1="186" y1="70" x2="80" y2="70" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3"/>
  <rect x="25" y="58" width="110" height="24" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
  <text x="80" y="74" font-family="'Pretendard', sans-serif" font-size="9.5" font-weight="bold" fill="#a5b4fc" text-anchor="middle">
    ③ 자석 팁 물받이 컵
  </text>

  <!-- ==================== PART 2: HANDLE & DIATOMITE ABSORPTION CAP ==================== -->
  <!-- Umbrella Hook Handle -->
  <path d="M 200 270 C 200 340 145 340 145 300 C 145 285 160 285 160 300 C 160 322 186 322 186 270 Z" 
        fill="#334155" stroke="#64748b" stroke-width="2"/>

  <!-- Diatomite Fast-Drying Cap -->
  <g transform="translate(200, 248)">
    <rect x="-24" y="-12" width="48" height="26" rx="6" fill="url(#capGrad)" stroke="#34d399" stroke-width="2" filter="url(#neonGlow)"/>
    <!-- Porous texture dots -->
    <circle cx="-12" cy="0" r="1.5" fill="#a7f3d0"/>
    <circle cx="-4" cy="-4" r="1" fill="#a7f3d0"/>
    <circle cx="6" cy="2" r="1.2" fill="#a7f3d0"/>
    <circle cx="14" cy="-2" r="1.5" fill="#a7f3d0"/>
    <circle cx="0" cy="5" r="1" fill="#a7f3d0"/>
  </g>
  <!-- Callout Tag 2 -->
  <line x1="176" y1="248" x2="80" y2="248" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3"/>
  <rect x="25" y="236" width="110" height="24" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="80" y="252" font-family="'Pretendard', sans-serif" font-size="9.5" font-weight="bold" fill="#34d399" text-anchor="middle">
    ② 규조토 급속흡수 캡
  </text>

  <!-- Bottom Verification Footer -->
  <rect x="25" y="348" width="350" height="34" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="200" y="370" font-family="'Pretendard', sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0" text-anchor="middle">
    ✨ 일회용 비닐 배출량 0g · 빗물 흐름 100% 차단 성공
  </text>
</svg>
