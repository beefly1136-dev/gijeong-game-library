    function startStage() {
        document.getElementById('transition-screen').style.display = 'none';
        document.getElementById('text-box').style.display = 'block';
        updateQuestion();
    }

    function updateDisplay() {
        if(stageIdx < scenarios.length) {
            const s = scenarios[stageIdx];
            document.getElementById('stage-title').innerText = s.tag;
            document.getElementById('stage-desc').innerText = s.desc;
            document.getElementById('background').style.backgroundImage = `url('${s.bg}')`;
            updateBars();
            updateBackButton();
        } else {
            showResult();
        }
    }

    function updateQuestion() {
        const s = scenarios[stageIdx];
        const qData = s.questions[currentStep];
        document.getElementById('question').innerText = qData.q;
        const container = document.getElementById('btn-container');
        container.innerHTML = "";
        
        const shuffledOpts = [...qData.opts].sort(() => Math.random() - 0.5);
        
        shuffledOpts.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt.text;
            btn.onclick = () => handleChoice(opt);
            container.appendChild(btn);
        });
    }

    function handleChoice(opt) {
        history.push({f, m, e, stageIdx, currentStep});
        
        f = Math.max(0, Math.min(100, f + opt.f));
        m = Math.max(0, Math.min(100, m + opt.m));
        e = Math.max(0, Math.min(100, e + opt.e));
        
        updateBars();

        if (f < 10) { 
            showBadEnding("가족 해체와 정서적 고립", "교과서에서 우려하는 '일과 가정의 불균형'이 극에 달했습니다. 가족 간의 유대가 완전히 상실되어 정서적으로 고립된 상태에 빠졌습니다.", "assets/fast-4303d84f85f3da7130df6ddb.webp"); 
            return; 
        }
        if (m < 10) { 
            showBadEnding("생애 경제적 자립 실패", "전 생애 관점의 자산 설계에 실패했습니다. '경제적 빈곤'으로 인해 자립적인 삶이 불가능해졌으며, 노후의 생계마저 위협받게 되었습니다.", "assets/fast-eb9cd613efe7816bf9e6ea7f.webp"); 
            return; 
        }
        if (e < 10) { 
            showBadEnding("자아 정체감 혼란 및 상실", "자신의 적성과 가치를 무시한 대가입니다. '자아 정체감의 혼돈' 속에서 삶의 의미와 목표를 잃고 무기력한 상태로 전락했습니다.", "assets/fast-e7c184859a041151abe04c9c.webp"); 
            return; 
        }

        if (opt.next === "nextStage") {
            stageIdx++;
            currentStep = "q1";
            if (stageIdx < scenarios.length) {
                document.getElementById('transition-screen').style.display = 'flex';
                document.getElementById('text-box').style.display = 'none';
                updateDisplay();
            } else {
                showResult();
            }
        } else {
            currentStep = opt.next;
            updateQuestion();
        }
        updateBackButton();
    }

    function handleBack() {
        if (history.length > 0) {
            const last = history.pop();
            f = last.f; m = last.m; e = last.e;
            stageIdx = last.stageIdx;
            currentStep = last.currentStep;
            
            document.getElementById('transition-screen').style.display = (currentStep === "q1") ? 'flex' : 'none';
            document.getElementById('text-box').style.display = (currentStep === "q1") ? 'none' : 'block';
            
            updateDisplay();
            updateQuestion();
        }
    }

    function updateBars() {
        ['f','m','e'].forEach(type => {
            let val = type==='f'?f:(type==='m'?m:e);
            document.getElementById(`bar-${type}`).style.width = val + "%";
            document.getElementById(`val-${type}`).innerText = val + "%";
        });
    }

    function updateBackButton() {
        document.getElementById('back-btn').style.display = history.length > 0 ? 'block' : 'none';
    }

    function showBadEnding(title, desc, bgImg) {
        document.getElementById('background').style.backgroundImage = `url('${bgImg}')`;
        document.getElementById('transition-screen').style.display = 'none';
        document.getElementById('text-box').style.display = 'block';
        
        document.getElementById('text-box').innerHTML = `
            <div style="text-align:center; padding: 10px;">
                <h2 style="color: #c0392b; margin-bottom: 5px; font-size: 18px;">생애 설계 위기 발생</h2>
                <h1 style="margin-bottom: 10px; color: #444; font-size: 24px;">[${title}]</h1>
                <p style="font-size: 16px; line-height: 1.5; color: #555; margin-bottom: 15px; padding: 0 10px;">${desc}</p>
                <button onclick="location.reload()" style="width: 240px; padding: 12px; background: #432818; color: white; border-radius: 12px; font-size: 15px; border: none; cursor: pointer;">인생 다시 설계하기</button>
            </div>`;
        
        document.querySelector('.stats-wrapper').style.display = 'none';
        document.getElementById('back-btn').style.display = 'none';
    }

    function showResult() {
        document.getElementById('transition-screen').style.display = 'none';
        document.getElementById('text-box').style.display = 'block';
        const max = Math.max(f, m, e);
        let resTitle = "", resDesc = "";
        
        if (max === f) {
            resTitle = "따뜻한 공동체의 중심";
            resDesc = "당신은 '일과 가정의 양립'을 성공적으로 실천하여 사랑이 가득한 생애를 완성했습니다. 교과서에서 강조하는 정서적 교감의 가치를 입증하셨군요!";
        } else if (max === m) {
            resTitle = "성공적인 자립형 자산가";
            resDesc = "당신은 전 생애에 걸친 경제적 설계를 완벽히 해냈습니다. 누구에게도 의지하지 않는 당당하고 계획적인 자립 생활의 표본이 되었습니다.";
        } else {
            resTitle = "끊임없이 성장한 자아실현가";
            resDesc = "당신은 청소년기부터 노년기까지 자아실현을 멈추지 않았습니다. 세상에 당신만의 독특한 가치를 남긴 위대한 성장의 삶입니다.";
        }

        document.getElementById('text-box').innerHTML = `
            <div style="text-align:center; padding: 10px;">
                <h2 style="margin-bottom:5px; color: #8b5e34;">전 생애 로드맵 완성</h2>
                <h1 style="color:#432818; margin-bottom:15px;">[${resTitle}]</h1>
                <p style="font-size:16px; line-height:1.6; color:#555; margin-bottom:15px;">${resDesc}</p>
                <div style="background:rgba(254, 243, 199, 0.2); padding:15px; border-radius:15px; margin-bottom:15px; font-weight:bold; display:flex; justify-content:space-around; border: 1px solid rgba(253, 230, 138, 0.2);">
                    <span>관계: ${f}%</span> | <span>자산: ${m}%</span> | <span>성장: ${e}%</span>
                </div>
                <button onclick="location.reload()" style="width:220px; padding: 15px; background:#432818; color:white; border-radius:12px; border:none; cursor:pointer;">새로운 생애 도전하기</button>
            </div>`;
    }

    updateDisplay();
</script>
