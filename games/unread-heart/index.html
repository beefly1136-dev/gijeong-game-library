.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 10px;padding:36px 22px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78em;font-weight:700;position:relative}

.sec{margin:16px 12px 4px;font-size:.78em;font-weight:800;color:var(--mut);letter-spacing:.04em}
#modal{background:#0b0e16cc;display:flex;align-items:center;justify-content:center;padding:12px;z-index:26}
#mBox{width:min(100%,640px);max-height:100%;overflow:auto;background:var(--paper);border-radius:18px;padding:20px 20px 16px;box-shadow:0 12px 40px #000c;user-select:text;-webkit-user-select:text}

.row{display:flex;gap:8px}.row .btn{flex:1}

.q{margin:12px 0;padding:11px 12px;border:1.5px solid var(--line);border-radius:13px;background:#fff}

#title{z-index:25;display:flex;align-items:center;justify-content:center;padding:16px;background:#141a2a center/cover no-repeat}

#tBox{position:relative;width:min(100%,430px);text-align:center;color:#fff}

@media (max-width:560px){:root{--fs:16px}.hb{gap:4px}.hb button{min-width:46px;min-height:46px;padding:4px 4px 3px;font-size:.6em}.hb button.sm{min-width:38px}.hb button svg{width:24px;height:24px}#obj{max-width:44vw;font-size:.9em;padding:6px 10px 6px 7px;flex-wrap:wrap;gap:4px}#mini{width:132px;height:88px;top:66px}#dBox{font-size:1.12em;padding:16px 16px 12px}}
